name: Publish EI100 flight dashboard
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'flight/**'
      - '.github/workflows/ei100-pages.yml'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ei100-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'rcoenen/lab'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Update aircraft data if flight is underway
        run: python3 flight/update_flight.py
      - name: Preserve observed flight history in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight/data/flight.json flight/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Record EI100 telemetry [skip ci]"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: flight
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
